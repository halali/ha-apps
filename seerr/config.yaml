---
name: Seerr
version: "3.4.1"
slug: seerr
description: >-
  Open-source media request and discovery manager for Jellyfin, Plex, and Emby.
  Drop-in replacement for Overseerr — existing data is auto-migrated on first start.
url: https://github.com/halali/ha-apps/tree/main/seerr
codenotary: notary@home-assistant.io
arch:
  - amd64
init: false
startup: application
boot: auto
host_network: false
hassio_api: true
hassio_role: default
# Ingress is deliberately OFF. Seerr is a Next.js Pages Router app and its
# basePath is baked into the client bundle at build time, so serving it under
# /api/hassio_ingress/<token> — a prefix that is unknown at build time and
# differs per installation — leaves the client bootstrap unable to reconcile
# its route. The page renders from SSR HTML but never becomes interactive: no
# window.next, no React root, no error anywhere. A sidebar entry that looks
# working and is not is worse than none, so the Web UI button points at the
# port instead.
ingress: false
webui: "http://[HOST]:[PORT:5055]"
ports:
  "5055/tcp": 5055
ports_description:
  "5055/tcp": Web UI / API (for webhook integrations and external clients)
map:
  - addon_config:rw
  - media:ro
  - share:rw
options:
  TZ: Europe/Bratislava
  LOG_LEVEL: info
schema:
  TZ: str
  LOG_LEVEL: list(silly|debug|info|warn|error)
image: ghcr.io/halali/ha-apps-amd64-seerr
