# $fwd_proto = the scheme the BROWSER used, which is not the scheme of our own
# hop. Home Assistant reaches nginx over plain http and states the real one in
# X-Forwarded-Proto, so forcing $scheme told *arr "http" on every ingress
# request and it built the absolute URLs it hands out -- redirects, SignalR
# negotiation, API self-links -- on the wrong protocol.
# Only an ingress request is trusted to carry that header, because it comes
# from Supervisor; the key is prefixed with X-Ingress-Path so nothing else can
# match. On direct port access the value is whatever a client on the LAN chose
# to send, so the connection scheme wins there, exactly as it did before. An
# ingress request that somehow arrives without a usable value falls back the
# same way rather than forwarding an empty scheme.
map "$http_x_ingress_path:$http_x_forwarded_proto" $fwd_proto {
    default           $scheme;
    "~^/.+:(https?)$" $1;
}

server {
    listen 7878 default_server;
    client_max_body_size 0;

    # $app = the HA ingress base path, taken from the per-request
    # X-Ingress-Path header Supervisor sets on EVERY ingress request.
    # Direct access on :7878 goes through no ingress proxy and carries no such
    # header, so $app is empty, every sub_filter below becomes a no-op and
    # direct access plus the API stay byte-for-byte as they were.
    set $app $http_x_ingress_path;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Without this nginx sends the upstream its own default Host, $proxy_host —
    # literally "127.0.0.1:7879". *arr derives the absolute URLs it hands out
    # from the Host header whenever the request carries no X-Forwarded-Host,
    # and app-to-app traffic (Prowlarr syncing, Bazarr polling, a peer fetching
    # a release) never sends one. Peers then receive links to 127.0.0.1:7879,
    # which inside *their* container is nothing, and the connection is refused.
    # Ingress escaped this only because Supervisor sets X-Forwarded-Host.
    # $http_host and not $host: peers reach this add-on on a non-default port
    # and $host drops the port.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    # sub_filter cannot scan a gzipped body, so ask the backend for plain text.
    # Without this every sub_filter below silently does nothing.
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 300;
    proxy_connect_timeout 30;

    # Keep backend redirects relative. Otherwise nginx re-absolutises them as
    # http://<host>:7878/... which the browser blocks as mixed content inside
    # the HTTPS ingress iframe.
    absolute_redirect off;
    # Three rules, because *arr's login redirect is not root-relative. ASP.NET
    # Core's cookie auth builds that target with BuildRedirectUri, which
    # absolutises it against Request.Scheme and Request.Host -- and the Host
    # forwarded above is Home Assistant's own external hostname, because
    # Supervisor copies the browser's Host header straight through to the
    # add-on. proxy_redirect matches a Location prefix literally, so the
    # root-relative rule never fired on "http://<ha-host>/login?returnUrl=%2F"
    # and the browser was sent out of the ingress path to Home Assistant's own
    # /login, which does not exist. Every unauthenticated request died there,
    # /initialize.json included, so the panel went blank rather than showing a
    # login form the moment *arr started requiring one.
    # Matching $http_host rewrites only redirects that point back at this
    # add-on; a Location naming any other host still passes through untouched.
    # On direct access $app is empty, so a self-referential redirect collapses
    # to a plain path -- same target, one less round trip for the client.
    proxy_redirect http://$http_host/  $app/;
    proxy_redirect https://$http_host/ $app/;
    proxy_redirect /                   $app/;

    sub_filter_once off;

    # Radarr's bootstrap JSON. Rewriting the HTML alone is NOT enough: the
    # entry bundle reads window.Radarr.urlBase only to fetch this file, then
    # REPLACES window.Radarr with the parsed response and derives the webpack
    # public path from it:
    #
    #   const n = `${window.Radarr.urlBase}/initialize.json?t=${Date.now()}`;
    #   window.Radarr = await (await fetch(n)).json();
    #   t.p = `${window.Radarr.urlBase}/`;
    #
    # Served unrewritten it carries urlBase "" and apiRoot "/api/v1", so the
    # public path collapses back to "/", the lazy chunks 404 against Home
    # Assistant itself and bootstrap never finishes — a blank page.
    location = /initialize.json {
        proxy_pass http://127.0.0.1:7879;
        sub_filter_types application/json;
        # *arr hand-builds this JSON with StringBuilder.AppendLine, so the real
        # bytes are pretty-printed: '"urlBase": ""' WITH a space after the
        # colon. Both spacings are listed because the compact form is what the
        # dev/non-production branch emits.
        sub_filter '"urlBase": ""'     '"urlBase": "$app"';
        sub_filter '"urlBase":""'      '"urlBase":"$app"';
        sub_filter '"apiRoot": "/api'  '"apiRoot": "$app/api';
        sub_filter '"apiRoot":"/api'   '"apiRoot":"$app/api';
    }

    location ^~ / {
        rewrite ^__INGRESS_ENTRY__/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:7879;

        # nginx always filters text/html, so naming application/json here adds
        # the API responses without losing the HTML rewrites below.
        sub_filter_types application/json;

        # Poster and fanart URLs are handed out by the API and used verbatim by
        # the UI. MovieImage.tsx (visible in the shipped source maps) is the
        # whole of it:
        #
        #   const imageUrl = image?.url ?? image?.remoteUrl;
        #   return imageUrl.replace(`${coverType}.jpg`, `${coverType}-${size}.jpg`);
        #
        # Nothing prepends urlBase -- *arr instead bakes its own UrlBase into
        # image.url server-side, and this add-on deliberately keeps UrlBase
        # empty so direct :7878 API access stays byte-for-byte clean for Bazarr
        # and Seerr. Through ingress the browser therefore received
        # "/MediaCover/1/poster.jpg", resolved it against the Home Assistant
        # origin rather than the add-on, got a 404 and fell back to the grey
        # placeholder for every poster. $app is empty on direct access, so this
        # rewrite is a no-op there and those API consumers are unaffected.
        sub_filter '"/MediaCover/' '"$app/MediaCover/';

        # The React shell hard-codes root-relative asset paths, so prefix those
        # too — otherwise the browser asks Home Assistant for /index-*.js.
        sub_filter "urlBase: ''"         "urlBase: '$app'";
        sub_filter 'href="/Content'      'href="$app/Content';
        sub_filter 'src="/Content'       'src="$app/Content';
        sub_filter 'content="/Content'   'content="$app/Content';
        sub_filter 'src="/index'         'src="$app/index';
        sub_filter 'href="/favicon.ico'  'href="$app/favicon.ico';
    }
}
