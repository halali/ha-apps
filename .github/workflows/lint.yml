---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hadolint:
    name: Hadolint (Dockerfiles)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [sonarr, radarr, lidarr, bazarr, seerr, prowlarr, appflowy]
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.addon }}/Dockerfile
          ignore: DL3006,DL3008,DL3018

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: frenck/action-yamllint@v1.5.0

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./"
          format: gcc

  nginx:
    name: nginx -t (ingress configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate each add-on's nginx config
        run: |
          set -uo pipefail
          fail=0
          for conf in */rootfs/etc/nginx/http.d/*.conf; do
            echo "::group::${conf}"
            # One at a time: every config binds its own default_server, so
            # loading them together would collide on the listen directive.
            docker run --rm -v "$PWD/${conf}:/etc/nginx/conf.d/ingress.conf:ro" \
              nginx:alpine sh -c 'rm -f /etc/nginx/conf.d/default.conf && nginx -t' \
              || fail=1
            echo "::endgroup::"
          done
          exit "$fail"

  pytest:
    name: pytest (auto-update script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt pytest
      - name: Run tests
        run: python -m pytest .github/scripts -q
