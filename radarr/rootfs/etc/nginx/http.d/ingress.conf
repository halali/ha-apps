server {
    listen 7878 default_server;
    client_max_body_size 0;

    location ^~ / {
        # $app = the HA ingress base path, taken from the per-request
        # X-Ingress-Path header Supervisor sets on EVERY ingress request.
        # Direct access on :7878 goes through no ingress proxy and carries no
        # such header, so $app is empty and every sub_filter below becomes a
        # no-op — direct access and the API stay byte-for-byte as they were.
        set $app $http_x_ingress_path;

        rewrite ^__INGRESS_ENTRY__/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:7879;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # sub_filter cannot scan a gzipped body, so ask the backend for plain
        # text. Without this every sub_filter below silently does nothing.
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300;
        proxy_connect_timeout 30;

        # Keep backend redirects relative. Otherwise nginx re-absolutises them
        # as http://<host>:7878/... which the browser blocks as mixed content
        # inside the HTTPS ingress iframe.
        absolute_redirect off;
        proxy_redirect / $app/;

        # Radarr's React shell hard-codes root-relative asset paths, and its
        # JS reads window.Radarr.urlBase to build the webpack public path and
        # every API / SignalR URL at runtime. Prefixing both with $app is what
        # makes the app load under the ingress path instead of requesting
        # /index-*.js from Home Assistant itself (which 404s -> blank page).
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter "urlBase: ''"         "urlBase: '$app'";
        sub_filter 'href="/Content'      'href="$app/Content';
        sub_filter 'src="/Content'       'src="$app/Content';
        sub_filter 'content="/Content'   'content="$app/Content';
        sub_filter 'src="/index'         'src="$app/index';
        sub_filter 'href="/favicon.ico'  'href="$app/favicon.ico';
    }
}
