server {
    listen 6767 default_server;
    client_max_body_size 0;

    location ^~ / {
        rewrite ^__INGRESS_ENTRY__/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:6768;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Without this nginx sends the upstream its own default Host,
        # $proxy_host — literally "127.0.0.1:6768". Bazarr derives the absolute
        # URLs it hands out from the Host header whenever the request carries
        # no X-Forwarded-Host, and app-to-app traffic never sends one, so peers
        # receive links to 127.0.0.1:6768 which inside *their* container is
        # nothing. Ingress escaped this only because Supervisor sets
        # X-Forwarded-Host. $http_host and not $host: peers reach this add-on
        # on a non-default port and $host drops the port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 30;
    }
}
