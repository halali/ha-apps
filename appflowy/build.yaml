---
build_from:
  # Debian trixie base — the AppFlowy binaries require glibc >= 2.39, which
  # bookworm (2.36) does not provide. trixie ships glibc 2.41.
  amd64: pgvector/pgvector:pg16-trixie
labels:
  org.opencontainers.image.title: "AppFlowy"
  org.opencontainers.image.description: "Self-hosted AppFlowy Cloud add-on for Home Assistant"
  org.opencontainers.image.source: "https://github.com/halali/ha-apps"
  org.opencontainers.image.licenses: "MIT"
image: ghcr.io/halali/ha-apps-amd64-appflowy
