server {
    listen 5055 default_server;

    # proxy_buffering ON (default) required for sub_filter to work.
    # nginx automatically disables buffering for WebSocket upgrades.
    gzip_static off;
    client_max_body_size 0;

    location ^~ / {
        # $app = HA ingress base path from the per-request X-Ingress-Path header
        # that Supervisor sets on EVERY ingress request. For direct port access
        # (http://host:5055) there is no ingress proxy and no such header, so
        # $app is empty — turning every $app-driven sub_filter and the injected
        # JS below into no-ops, serving plain unpatched Seerr (the pre-proxy
        # behaviour). Fixes the "UI stuck loading on :5055 after upgrade"
        # regression: direct access no longer inherits the ingress path-rewriting
        # machinery (incl. the global HTMLScriptElement.src patch) it never needs.
        set $app $http_x_ingress_path;

        rewrite ^__INGRESS_ENTRY__/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5056;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_hide_header X-Powered-By;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable backend gzip so sub_filter can scan responses
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 90;

        absolute_redirect off;
        proxy_redirect ^ $app;
        proxy_redirect /setup $app/setup;
        proxy_redirect /login $app/login;

        # ── Attribute-scoped HTML substitutions ──────────────────────────────
        # Only replace inside HTML attribute values (src=, href=).
        # This avoids corrupting the __NEXT_DATA__ JSON embedded in the HTML,
        # which uses the same path strings and is parsed by React at hydration.
        sub_filter_once off;
        sub_filter_types text/html;

        # Next.js static assets
        sub_filter 'src="/_next'            'src="$app/_next';
        sub_filter 'href="/_next'           'href="$app/_next';

        # Navigation links
        sub_filter 'href="/"'               'href="$app"';
        sub_filter 'href="/login"'          'href="$app/login"';
        sub_filter 'href="/setup"'          'href="$app/setup"';

        # PWA / favicon / logo — appear as both href= and src= depending on tag
        sub_filter 'href="/android-'        'href="$app/android-';
        sub_filter 'src="/android-'         'src="$app/android-';
        sub_filter 'href="/apple-'          'href="$app/apple-';
        sub_filter 'src="/apple-'           'src="$app/apple-';
        sub_filter 'href="/favicon'         'href="$app/favicon';
        sub_filter 'src="/favicon'          'src="$app/favicon';
        sub_filter 'href="/logo_'           'href="$app/logo_';
        sub_filter 'src="/logo_'            'src="$app/logo_';
        sub_filter 'href="/site.webmanifest' 'href="$app/site.webmanifest';
        sub_filter 'src="/site.webmanifest'  'src="$app/site.webmanifest';

        # Image src attributes
        sub_filter 'src="/images/'          'src="$app/images/';
        sub_filter 'src="/imageproxy/'      'src="$app/imageproxy/';
        sub_filter 'src="/avatarproxy/'     'src="$app/avatarproxy/';

        # ── Injected JS patches ───────────────────────────────────────────────
        # 1. Patch window.open: plex.ts opens window.open('/login/plex/loading')
        #    without the ingress prefix — must prepend it so HA routes correctly.
        # 2. Polyfill crypto.randomUUID for non-secure (HTTP) contexts.
        # 3. Patch fetch/XHR to prepend ingress prefix to /api/v1 calls —
        #    replaces the dangerous HTML sub_filter approach.
        sub_filter '<head>' '<head><script>(function(){
var p="$app";
// ── TEMPORARY DIAGNOSTICS (remove once the Plex login bug is understood) ─────
// The Plex button does nothing under ingress: no popup, no request to plex.tv,
// no console error. JS cannot be run against this page from outside, so the
// page reports its own progress by pinging /__diag (nginx 404s it harmlessly);
// the pings are visible in the browser network log.
// Reported through document.title: it survives navigation, needs no network
// log and no JS access to the page, and every browser tool shows the tab title.
var D=[];
function d(k,v){D.push(k+"="+String(v).slice(0,40));try{document.title="DIAG["+D.join("|")+"]"}catch(e){}}
d("loaded",1);
// React reports hydration failures through console.error, which the browser
// tooling did not surface — capture it here so it reaches the title.
var _ce=console.error.bind(console);
console.error=function(){try{d("cerr",Array.prototype.join.call(arguments," ").slice(0,60))}catch(e){}return _ce.apply(console,arguments)};
var _cw=console.warn.bind(console);
console.warn=function(){try{d("cwarn",Array.prototype.join.call(arguments," ").slice(0,50))}catch(e){}return _cw.apply(console,arguments)};
// React 18 marks its root with a __reactContainer$<n> key, not the React 17
// _reactRootContainer the earlier probe looked for — that gave a false "hydrated=0".
setTimeout(function(){
  var n=document.getElementById("__next")||document.body;
  var react=Object.keys(n||{}).some(function(k){return k.indexOf("__reactContainer")===0||k.indexOf("__reactFiber")===0});
  var tp=globalThis.TURBOPACK;
  d("react",react?1:0);
  d("turbopack",(tp&&tp.length!==undefined)?("arr:"+tp.length):(typeof tp));
  d("nextGlobal",typeof window.next);
  d("scripts",document.querySelectorAll("script[src]").length);
},6000);
document.addEventListener("click",function(e){d("click",(e.target&&e.target.tagName))},true);
window.addEventListener("error",function(e){d("error",e.message)});
window.addEventListener("unhandledrejection",function(e){d("reject",(e.reason&&e.reason.message)||e.reason)});
var _o=window.open.bind(window);
window.open=function(u,t,f){
  if(typeof u==="string"&&u[0]==="/"&&u.slice(0,p.length)!==p)u=p+u;
  var w=_o(u,t,f);
  d("open",(w?"window":"NULL"));
  return w
};
if(!crypto.randomUUID)crypto.randomUUID=function(){
  return"10000000-1000-4000-8000-100000000000".replace(/[018]/g,function(c){
    return(+c^(Math.random()*16>>+c/4)).toString(16)
  })
};
var _f=window.fetch;
window.fetch=function(r,o){
  if(typeof r==="string"&&r[0]==="/"&&r.slice(0,p.length)!==p)r=p+r;
  return _f.call(this,r,o)
};
var _x=window.XMLHttpRequest;
function PatchedXHR(){var x=new _x();var _open=x.open.bind(x);x.open=function(m,u){if(typeof u==="string"&&u[0]==="/"&&u.slice(0,p.length)!==p)u=p+u;return _open(m,u)};return x}
PatchedXHR.prototype=_x.prototype;
window.XMLHttpRequest=PatchedXHR;
try{var sd=Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype,"src");if(sd&&sd.set)Object.defineProperty(HTMLScriptElement.prototype,"src",{get:sd.get,set:function(v){if(typeof v==="string"&&v.startsWith("/_next/"))v=p+v;sd.set.call(this,v)},configurable:true});}catch(e){}
})();</script>';
    }
}
